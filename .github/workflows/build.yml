name: build-wasm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (with asl-release submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build WASM modules
        run: ./wasm/build.sh

      - name: Smoke test
        run: node js/smoke-test.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: asl-wasm-dist
          path: dist/

      - name: Determine upstream AS version
        id: upstream
        run: |
          version="$(git -C asl-release log -1 --format='%s (%h)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            WebAssembly build of the Macroassembler AS.
            Based on asl-release: ${{ steps.upstream.outputs.version }}
          files: dist/*

      - name: Assemble GitHub Pages site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages
          cp -r dist pages/dist
          cp -r demo pages/demo
          printf '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=demo/">\n' > pages/index.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
